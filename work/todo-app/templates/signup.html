{% extends "base.html" %}
{% block title %}Create account — TaskFlow{% endblock %}
{% block content %}
<section class="auth-card">
    <div class="auth-copy">
        <p class="eyebrow">Start your workspace</p>
        <h1>Create an account</h1>
        <p>Your tasks remain private to your account.</p>
    </div>
    <form class="auth-form" method="post" action="{{ url_for('signup') }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" minlength="1" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>

        <button class="button button-primary" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
